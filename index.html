<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aline Saos — Conseillère Chogan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5ede0;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .2em;
      color: #b8924a;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #c8a96e;
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
      transition: opacity .15s, transform .1s;
    }

    a.btn:last-of-type { margin-bottom: 0; }
    a.btn:hover { opacity: .88; transform: translateY(-1px); }
    a.btn:active { transform: scale(.98); }

    .btn-1 {
      background: #c8a96e;
      color: #2c1a00;
    }

    .btn-2 {
      background: #1a1a2e;
      color: #e8e0ff;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 1.75rem;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">Chogan</div>
    <h1>Aline Saos</h1>
    <p class="subtitle">Conseillère indépendante</p>
    <div class="divider"></div>

    <a class="btn btn-1" href="https://www.chogangroupspa.com/referral/ALI2F474C">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
        <path d="M9 12h6M9 8h6M9 16h4"/>
      </svg>
      Visiter notre boutique
    </a>

    <a class="btn btn-2" href="https://drive.google.com/drive/folders/1GJRv_vapNgMSA_pQPL_ACyqjPewmjPb7?usp=drive_link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Notre catalogue
    </a>

    <p class="footer">06.98.12.36.22</p>
  </div>
</body>
</html>
